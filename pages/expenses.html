<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track an Expense | Expense Tracker</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <nav class="navbar" aria-label="Main navigation">
      <a class="brand" href="../index.html">Expense Tracker</a>
      <a href="expenses.html">Track an expense</a>
    </nav>

    <main class="form-page">
      <dialog class="card" id="expense-dialog" aria-labelledby="form-title">
        <h1 id="form-title">Add an expense</h1>
        <p class="section-copy">Keep the details short and accurate.</p>

        <form id="expense-form">
          <div class="field-group">
            <label for="description">Description</label>
            <input id="description" name="description" type="text" required />
          </div>

          <div class="form-row">
            <div class="field-group">
              <label for="amount">Amount</label>
              <input id="amount" name="amount" type="number" min="0.01" step="0.01" required />
            </div>

            <div class="field-group">
              <label for="date">Date</label>
              <input id="date" name="date" type="date" required />
            </div>
          </div>

          <div class="field-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="">Choose a category</option>
              <option value="food">Food</option>
              <option value="transport">Transport</option>
              <option value="bills">Bills</option>
              <option value="shopping">Shopping</option>
              <option value="other">Other</option>
            </select>
          </div>

          <button class="button" type="submit">Save expense</button>
          <button class="button button-secondary" id="cancel-edit" type="button" hidden>Cancel edit</button>
        </form>
      </dialog>

      <section class="expense-list" aria-labelledby="list-title">
        <div class="list-heading">
          <div>
            <p class="eyebrow">Your activity</p>
            <h2 id="list-title">Saved expenses</h2>
          </div>
          <button class="button add-button" id="open-form" type="button">Add expense</button>
        </div>
        <div class="summary-grid" aria-label="Spending summary">
          <div class="summary-card">
            <span>Total spending</span>
            <strong id="total-spending">0.00</strong>
          </div>
          <div class="summary-card">
            <span>Categories</span>
            <strong id="category-count">0</strong>
          </div>
        </div>

        <label class="filter-label" for="category-filter">Filter by category</label>
        <select id="category-filter">
          <option value="all">All categories</option>
          <option value="food">Food</option>
          <option value="transport">Transport</option>
          <option value="bills">Bills</option>
          <option value="shopping">Shopping</option>
          <option value="other">Other</option>
        </select>

        <div id="category-summary" class="category-summary" aria-live="polite"></div>
        <p id="empty-state" class="section-copy">No expenses saved yet.</p>
        <div class="table-wrap">
          <table id="expense-table" hidden>
            <thead>
              <tr>
                <th scope="col">Description</th>
                <th scope="col">Category</th>
                <th scope="col">Date</th>
                <th scope="col">Amount</th>
                <th scope="col"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="expense-items"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="../js/app.js"></script>
  </body>
</html>
